<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Consolas, Monaco, monospace">
  <defs>
    <style>
      .frame { fill: #fafafa; stroke: #444; stroke-width: 2; }
      .label { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; }
      .code { font-size: 12px; fill: #222; }
      .key-en { fill: #2E86AB; font-weight: bold; }
      .key-target { fill: #3d8b37; font-weight: bold; }
      .key-proper { fill: #A23B72; font-weight: bold; }
      .key-random { fill: #888; font-weight: bold; }
      .legend-box { stroke-width: 1.5; }
    </style>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">JSONL Task Format</text>

  <rect x="40" y="45" width="640" height="220" class="frame" rx="6"/>

  <text x="60" y="75" class="code">{</text>
  <text x="80" y="100" class="code">  <tspan class="key-en">"en"</tspan>: "Open the consumption model...",</text>
  <text x="80" y="125" class="code">  <tspan class="key-target">"de"</tspan>: "Oeffnen Sie das Verbrauchsmodell...",</text>
  <text x="80" y="150" class="code">  <tspan class="key-proper">"proper_terms"</tspan>: consumption model -&gt; Verbrauchsmodell,</text>
  <text x="80" y="175" class="code">  <tspan class="key-random">"random_terms"</tspan>: Open -&gt; Oeffnen</text>
  <text x="60" y="200" class="code">}</text>

  <text x="60" y="290" class="label">Field legend</text>
  <rect x="60" y="300" width="16" height="16" class="legend-box" fill="#2E86AB" fill-opacity="0.3" stroke="#2E86AB"/>
  <text x="85" y="313" class="label" font-weight="normal">en - English source</text>

  <rect x="220" y="300" width="16" height="16" class="legend-box" fill="#3d8b37" fill-opacity="0.3" stroke="#3d8b37"/>
  <text x="245" y="313" class="label" font-weight="normal">de/ru/es - reference</text>

  <rect x="400" y="300" width="16" height="16" class="legend-box" fill="#A23B72" fill-opacity="0.3" stroke="#A23B72"/>
  <text x="425" y="313" class="label" font-weight="normal">proper_terms - domain IT pairs</text>

  <rect x="60" y="335" width="16" height="16" class="legend-box" fill="#888" fill-opacity="0.3" stroke="#888"/>
  <text x="85" y="348" class="label" font-weight="normal">random_terms - control (non-domain)</text>

  <text x="360" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-style="italic">500 sentences/lang (dev_v1) | EN-DE, EN-RU, EN-ES</text>
</svg>
